id: detailed_analysis
name: 详细分析
description: 深入分析项目架构、模块、数据流、风险和扩展路径。
version: 1.0.0
steps:
  - id: repository
    title: 收集项目画像
    tool: repo_summary
  - id: analysis
    title: 深入阅读关键模块
    needs: [repository]
    readOnly: true
    agent: |
      输出语言要求：全文必须使用简体中文。代码、命令、文件路径和技术专有名词可以保留英文；
      如果资料来自英文 README 或英文注释，必须先理解再用中文概括，不得直接复制大段英文内容。
      对当前项目做深入分析。必须阅读入口、配置、核心模块和测试，而不是只依据文件名推测。
      依次说明：项目目标、目录与模块职责、启动路径、关键数据流、状态与持久化、外部依赖、
      扩展点、测试策略、已发现的技术风险，以及建议的下一步阅读顺序。引用具体文件路径。
      使用适合手机阅读的小标题和短段落，不要修改文件。
      基础画像：
      {{steps.repository}}
